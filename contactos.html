<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Huellita - Contacto</title>
    <link rel="stylesheet" href="contacto_style.css">
</head>
<body>
    

    <section id="contacto">
        <div class="texto-hero">
            <h1>Comprometidos con la Salud y Cuidado de tus Mascotas.</h1>
            <p>Somos un centro veterinario en sintonía con la transformación digital.</p>
        </div>

        <div class="formulario-container">
            <h3>¡TE CONTACTAMOS!</h3>
            <p>Completa tus datos y te contactaremos para coordinar tu atención</p>
            <input type="text" id="nombre" placeholder="Nombres y Apellidos*">
            <input type="tel" id="telefono" placeholder="Teléfono*">
            <input type="email" id="correo" placeholder="Correo Electrónico*">
            <input type="text" id="servicio" placeholder="¿Qué servicio necesitas?*">
            <button onclick="enviarFormulario()">ENVIAR</button>
        </div>
    </section>


    <!-- Enlace al script externo -->
    <script src="script_contacto.js"></script>
</body>
</html>
