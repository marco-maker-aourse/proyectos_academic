

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
    <link rel="stylesheet" href="contacto_style.css">
</head>
<body>
    <header>
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="#contacto">Contacto</a>
    </nav>
        <div class="logo">Veterinario Senati</div>
    </header>

    <section id="inicio">
        <h1>Bienvenido</h1>
        <p>Servicios veterinarios de calidad para tus mascotas</p>
    </section>

    <section id="productos">
        <h1>Productos</h1>
        <p>Alimentos, medicinas y accesorios para mascotas</p>
    </section>

    <section id="contacto">
    <h1>Contacto</h1>

    <div class="formulario">
        <input type="text" id="nombre" placeholder="Nombre">
        <input type="email" id="correo" placeholder="Correo">
        <textarea id="mensaje" placeholder="Mensaje"></textarea>
        <button onclick="enviarFormulario()">Enviar</button>
    </div>

</section>
</body>
</html>
